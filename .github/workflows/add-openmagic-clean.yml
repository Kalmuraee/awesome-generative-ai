name: Prepare clean OpenMagic contribution

on:
  push:
    branches:
      - promotion/openmagic-vibe-coding-20260828

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: promotion/openmagic-vibe-coding-20260828
          fetch-depth: 0

      - name: Add OpenMagic to Vibe Coding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          if "Kalmuraee/OpenMagic" in text or "[OpenMagic]" in text:
              raise SystemExit("OpenMagic is already present; refusing to duplicate it")
          anchor = '* [Replit](https://replit.com/): "Simply describe your idea above and let the Agent build it for you"\n'
          entry = '* [OpenMagic](https://github.com/Kalmuraee/OpenMagic): open-source AI coding toolbar that overlays a running web app; click an element, describe a change, review the diff, and apply verified source edits with hot reload using cloud or local models\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected one Replit anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, anchor + entry, 1), encoding="utf-8")
          PY

      - name: Remove temporary workflow and validate
        run: |
          rm .github/workflows/add-openmagic-clean.yml
          git diff --check
          test "$(git diff --numstat README.md | wc -l)" -eq 1
          test "$(git diff -- README.md | grep -c '^+.*OpenMagic')" -eq 1

      - name: Commit the clean contribution
        run: |
          git config user.name "Khalid Almuraee"
          git config user.email "Khalid.s.almuraee@gmail.com"
          git add README.md .github/workflows/add-openmagic-clean.yml
          git commit -m "Add OpenMagic to Vibe Coding"
          git push origin HEAD:promotion/openmagic-vibe-coding-20260828
